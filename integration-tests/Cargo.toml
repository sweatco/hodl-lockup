[package]
name = "integration-tests"
version = "1.0.0"
publish = false
edition = "2021"

[lib]
name = "integration_tests"

[dependencies]
rand = "0.8.5"
tokio = { version = "1.28", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.75"
serde_json = "1.0"

# near-sdk's own build guard requires one of a fixed set of cfgs/features for
# any non-wasm32 build; hodl-model (a transitive dep here, not the crate
# under `--test`) doesn't get `cfg(test)`, so this crate must directly
# request the guard's documented escape hatch for non-contract usage. Cargo's
# feature unification then activates it for the single resolved near-sdk
# instance shared with hodl-model.
near-sdk = { version = "5.28.3", features = ["non-contract-usage"] }
near-workspaces = "0.23"

hodl-model = { path = "../model" }

# Empty `[workspace]` makes this crate its own workspace root, detached from
# the parent so it can use its own `rust-toolchain.toml` and dependency lock
# -- near-workspaces needs a much newer dependency graph than the contract's
# own `cargo near build` ABI-generation path tolerates. Same pattern as
# sweat-jar's integration-tests.
[workspace]
