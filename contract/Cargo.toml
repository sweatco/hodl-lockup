[package]
name = "hodl-lockup"
version = "1.1.0"
authors = ["Sweat Economy"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = ["release"]
release = ["hodl-model/release-api"]
integration-test = [
    "hodl-model/release-api",
    "hodl-model/integration-methods",
]
integration-api = ["hodl-model/integration-api"]

[dependencies]

near-sdk = { workspace = true, features = ["unit-testing"] }
near-self-update-proc = { workspace = true }
near-contract-standards = { workspace = true }

hodl-model = { workspace = true }

[dev-dependencies]
fake = { workspace = true }
rand = { workspace = true }
sha256 = { workspace = true }
crypto-hash = "0.3"
base64 = { workspace = true }
