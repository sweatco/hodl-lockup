[package]
name = "hodl-lockup"
version = "1.1.0"
authors = ["Sweat Economy"]
edition = "2021"
repository = "https://github.com/sweatco/hodl-model"

[lib]
crate-type = ["cdylib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.13.4-rust-1.85.0"
image_digest = "sha256:a9d8bee7b134856cc8baa142494a177f2ba9ecfededfcdd38f634e14cca8aae2"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[features]
default = ["release"]
release = ["hodl-model/release-api"]
integration-test = ["hodl-model/release-api", "hodl-model/integration-methods"]
integration-api = ["hodl-model/integration-api"]

[dependencies]

near-sdk = { workspace = true, features = ["unit-testing"] }
near-contract-standards = { workspace = true }
near-plugins = { workspace = true }
strum = { workspace = true }

hodl-model = { workspace = true }

[dev-dependencies]
fake = { workspace = true }
rand = { workspace = true }
sha256 = { workspace = true }
crypto-hash = "0.3"
base64 = { workspace = true }
