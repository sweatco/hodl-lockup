[workspace]

resolver = "2"

default-members = ["contract"]
# `integration-tests` is deliberately NOT a member: it pulls near-workspaces,
# which needs a much newer dependency graph (near-primitives-core etc.) than
# the contract's own `cargo near build` ABI-generation path tolerates (it
# conflicts with the near-global-contracts version cargo-near resolves for
# the wasm build). Kept detached with its own `[workspace]`/lockfile/
# rust-toolchain.toml, same as sweat-jar's integration-tests.
members = ["model", "contract"]

[workspace.dependencies]
anyhow = "1.0.75"
async-trait = "0.1.73"
fake = "4.0.0"
rand = "0.8.5"
base64 = "0.22.1"
sha256 = "1.3.0"
tokio = { version = "1.28" }
uint = "0.10.0"
serde_json = "1.0"

ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }

hodl-model = { path = "model" }

near-sdk = "5.29.0"
near-contract-standards = "5.29.0"
near-plugins = "0.5.3"
strum = { version = "0.27", features = ["derive"] }
